<div class="sd-time-spinner__columns">
  <!-- hour -->
  <div class="sd-time-spinner__col">
    <button mat-icon-button [disabled]="disabled()" (click)="stepHourUp()" [attr.aria-label]="intl.incrementHourLabel">
      <mat-icon>keyboard_arrow_up</mat-icon>
    </button>
    <input
      type="text"
      inputmode="numeric"
      maxlength="2"
      class="sd-time-spinner__digits"
      [value]="displayHour()"
      [disabled]="disabled()"
      (focus)="setFocus('hour')"
      (blur)="clearFocus()"
      (keydown)="onDigitKeyDown($event)"
      (keydown)="onSpinKeyDown('hour', $event)"
      (input)="onInputEvent('hour', $event)"
      role="spinbutton"
      aria-valuemin="0"
      aria-valuemax="23"
      [attr.aria-valuenow]="hour()"
      [attr.aria-label]="intl.hourLabel">
    <button mat-icon-button [disabled]="disabled()" (click)="stepHourDown()" [attr.aria-label]="intl.decrementHourLabel">
      <mat-icon>keyboard_arrow_down</mat-icon>
    </button>
  </div>

  <span class="sd-time-spinner__sep">:</span>

  <!-- minute -->
  <div class="sd-time-spinner__col">
    <button mat-icon-button [disabled]="disabled()" (click)="stepMinuteUp()" [attr.aria-label]="intl.incrementMinuteLabel">
      <mat-icon>keyboard_arrow_up</mat-icon>
    </button>
    <input
      type="text"
      inputmode="numeric"
      maxlength="2"
      class="sd-time-spinner__digits"
      [value]="displayMinute()"
      [disabled]="disabled()"
      (focus)="setFocus('minute')"
      (blur)="clearFocus()"
      (keydown)="onDigitKeyDown($event)"
      (keydown)="onSpinKeyDown('minute', $event)"
      (input)="onInputEvent('minute', $event)"
      role="spinbutton"
      aria-valuemin="0"
      aria-valuemax="59"
      [attr.aria-valuenow]="minute()"
      [attr.aria-label]="intl.minuteLabel">
    <button mat-icon-button [disabled]="disabled()" (click)="stepMinuteDown()" [attr.aria-label]="intl.decrementMinuteLabel">
      <mat-icon>keyboard_arrow_down</mat-icon>
    </button>
  </div>

  @if (showSeconds()) {
    <span class="sd-time-spinner__sep">:</span>
    <!-- second -->
    <div class="sd-time-spinner__col">
      <button mat-icon-button [disabled]="disabled()" (click)="stepSecondUp()" [attr.aria-label]="intl.incrementSecondLabel">
        <mat-icon>keyboard_arrow_up</mat-icon>
      </button>
      <input
        type="text"
        inputmode="numeric"
        maxlength="2"
        class="sd-time-spinner__digits"
        [value]="displaySecond()"
        [disabled]="disabled()"
        (focus)="setFocus('second')"
        (blur)="clearFocus()"
        (keydown)="onDigitKeyDown($event)"
        (keydown)="onSpinKeyDown('second', $event)"
        (input)="onInputEvent('second', $event)"
        role="spinbutton"
        aria-valuemin="0"
        aria-valuemax="59"
        [attr.aria-valuenow]="second()"
        [attr.aria-label]="intl.secondLabel">
      <button mat-icon-button [disabled]="disabled()" (click)="stepSecondDown()" [attr.aria-label]="intl.decrementSecondLabel">
        <mat-icon>keyboard_arrow_down</mat-icon>
      </button>
    </div>
  }
</div>
