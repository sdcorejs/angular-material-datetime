<ng-template #panel>
  <div
    class="sd-datetime-picker__panel"
    role="dialog"
    aria-modal="true"
    [id]="panelId"
    [attr.aria-label]="intl.dialogLabel"
    tabindex="-1"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    cdkFocusInitial
    (keydown.escape)="onEscape($event)">
    <mat-calendar
      [selected]="selected()"
      [minDate]="minDate()"
      [maxDate]="maxDate()"
      [startAt]="startAt()"
      (selectedChange)="selectDatePart($event)">
    </mat-calendar>

    <sd-time-spinner
      [value]="selected()"
      [baseValue]="spinnerBaseValue()"
      [showSeconds]="showSeconds()"
      [stepMinute]="stepMinute()"
      [disabled]="disabledEffective()"
      (valueChange)="selectTimePart($event)">
    </sd-time-spinner>

    <ng-content select="sd-datetime-picker-actions">
      <!-- Fallback: default actions when consumer does not project custom content -->
      <div class="sd-datetime-picker__default-actions">
        <button mat-button type="button" class="sd-datetime-picker__default-now" (click)="now()">
          <mat-icon>schedule</mat-icon>
          {{ intl.nowLabel }}
        </button>
        <button mat-button type="button" (click)="cancel()">{{ intl.cancelLabel }}</button>
        <button mat-flat-button type="button" [disabled]="!canApply()" (click)="apply()">{{ intl.applyLabel }}</button>
      </div>
    </ng-content>
  </div>
</ng-template>
