name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'projects/datetime/**'
      - '.changeset/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/**'
      - '.github/workflows/release.yml'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Install dependencies
        run: npm ci

      - name: Verify release workflow
        run: npm run test:release-workflow

      - name: Test package baseline comparator
        run: node --test tools/compare-package-baseline.test.mjs

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build all libraries
        run: npm run build:all

      - name: Pack release artifact once
        id: release-artifact
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/datetime-release"
          mkdir -p "$release_dir"
          pack_json="$(npm pack ./dist/datetime --json --pack-destination "$release_dir")"
          printf '%s\n' "$pack_json" > "$release_dir/npm-pack.json"
          filename="$(node -e 'process.stdout.write(JSON.parse(process.argv[1])[0].filename)' "$pack_json")"
          tarball="$(realpath "$release_dir/$filename")"
          sha256="$(sha256sum "$tarball" | cut -d ' ' -f 1)"
          node -e '
            const fs = require("node:fs");
            const pack = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))[0];
            const metadata = {
              filename: pack.filename,
              sha256: process.argv[2],
              integrity: pack.integrity,
              shasum: pack.shasum,
            };
            fs.writeFileSync(process.argv[3], `${JSON.stringify(metadata, null, 2)}\n`);
          ' "$release_dir/npm-pack.json" "$sha256" "$release_dir/release-metadata.json"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "directory=$release_dir" >> "$GITHUB_OUTPUT"

      - name: Verify Angular Package Format output
        run: node tools/verify-package.mjs --tarball "${{ steps.release-artifact.outputs.tarball }}"

      - name: Compare public package surface with 1.0.3
        run: node tools/compare-package-baseline.mjs --tarball "${{ steps.release-artifact.outputs.tarball }}" --baseline @sdcorejs/angular-material-datetime@1.0.3

      - name: Verify Angular 19 packed consumer
        run: node tools/consumer-smoke.mjs --tarball "${{ steps.release-artifact.outputs.tarball }}" --angular=19

      - name: Verify Angular 20 packed consumer
        run: node tools/consumer-smoke.mjs --tarball "${{ steps.release-artifact.outputs.tarball }}" --angular=20

      - name: Verify Angular 21 packed consumer
        run: node tools/consumer-smoke.mjs --tarball "${{ steps.release-artifact.outputs.tarball }}" --angular=21

      - name: Verify Angular 22 packed consumer
        run: node tools/consumer-smoke.mjs --tarball "${{ steps.release-artifact.outputs.tarball }}" --angular=22

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: datetime-release-artifact
          path: ${{ steps.release-artifact.outputs.directory }}
          if-no-files-found: error

      - name: Setup npm for trusted publishing
        run: npm install --global npm@11.19.1

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SD_DATETIME_RELEASE_TARBALL: ${{ steps.release-artifact.outputs.tarball }}
          SD_DATETIME_RELEASE_SHA256: ${{ steps.release-artifact.outputs.sha256 }}
